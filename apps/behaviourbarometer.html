<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Behaviour barometer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: #14181D;
    color: #F5F2EC;
  }

  #app {
    position: fixed;
    inset: 0;
    cursor: pointer;
  }

  /* The rising fill */
  #fill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    background: #E23B2E;
    transition: height 260ms cubic-bezier(.22,1,.36,1), background-color 400ms linear;
  }

  /* Wave surface riding on top of the fill */
  #wave {
    position: absolute;
    left: 0;
    bottom: 100%;
    width: 200%;
    height: 26px;
    animation: drift 3.2s linear infinite;
  }
  #wave svg { display: block; width: 100%; height: 100%; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    #wave { animation: none; }
    #fill { transition: height 100ms linear, background-color 100ms linear; }
  }

  /* Scale ticks along the left edge */
  #ticks {
    position: absolute;
    left: 14px; top: 0; bottom: 0;
    width: 44px;
    pointer-events: none;
  }
  .tick {
    position: absolute;
    left: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    transform: translateY(50%);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(245,242,236,0.45);
    font-weight: 500;
  }
  .tick::before {
    content: "";
    display: block;
    width: 14px;
    height: 1px;
    background: rgba(245,242,236,0.35);
  }

  /* Central readout */
  #readout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    mix-blend-mode: difference; /* stays legible over fill & background */
  }
  #score {
    font-family: 'Anton', sans-serif;
    font-size: clamp(120px, 42vw, 240px);
    line-height: 1;
    color: #F5F2EC;
    font-variant-numeric: tabular-nums;
  }
  #label {
    margin-top: 10px;
    font-size: 15px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #F5F2EC;
    opacity: 0.85;
    min-height: 20px;
    text-align: center;
  }

  #hint {
    position: absolute;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(245,242,236,0.5);
    pointer-events: none;
    transition: opacity 500ms ease;
  }

  /* Controls */
  .btn {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top));
    z-index: 5;
    background: rgba(20,24,29,0.35);
    border: 1px solid rgba(245,242,236,0.25);
    color: rgba(245,242,236,0.85);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
  }
  .btn:focus-visible { outline: 2px solid #F5F2EC; outline-offset: 2px; }
  #resetBtn { right: 14px; }
  #minusBtn { left: 14px; }

  /* Tap ripple */
  .ripple {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid rgba(245,242,236,0.9);
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.9;
    pointer-events: none;
    animation: rippleOut 550ms ease-out forwards;
  }
  @keyframes rippleOut {
    to { transform: translate(-50%, -50%) scale(7); opacity: 0; }
  }

  /* Celebration at 100 */
  #app.maxed #score { animation: pop 500ms cubic-bezier(.22,1.6,.36,1); }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<div id="app" role="button" aria-label="Tap to increase behaviour rating" tabindex="0">

  <div id="fill">
    <div id="wave" aria-hidden="true">
      <svg viewBox="0 0 1200 26" preserveAspectRatio="none">
        <path id="wavePath" d="M0,13 C75,0 150,26 300,13 C450,0 525,26 600,13 C675,0 750,26 900,13 C1050,0 1125,26 1200,13 L1200,26 L0,26 Z" fill="#E23B2E"/>
      </svg>
    </div>
  </div>

  <div id="ticks" aria-hidden="true">
    <div class="tick" style="bottom:25%">25</div>
    <div class="tick" style="bottom:50%">50</div>
    <div class="tick" style="bottom:75%">75</div>
  </div>

  <div id="readout">
    <div id="score">0</div>
    <div id="label">Let's get started</div>
  </div>

  <div id="hint">Tap anywhere · +1</div>

  <button class="btn" id="minusBtn" aria-label="Decrease rating by one">−1</button>
  <button class="btn" id="resetBtn" aria-label="Reset rating to zero">Reset</button>
</div>

<script>
  const app = document.getElementById('app');
  const fill = document.getElementById('fill');
  const wavePath = document.getElementById('wavePath');
  const scoreEl = document.getElementById('score');
  const labelEl = document.getElementById('label');
  const hint = document.getElementById('hint');
  const resetBtn = document.getElementById('resetBtn');
  const minusBtn = document.getElementById('minusBtn');

  let score = 0;
  let interacted = false;

  // Colour ramp: red -> amber -> green
  const stops = [
    { at: 0,   c: [226, 59, 46]  },  // red
    { at: 40,  c: [240, 138, 36] },  // amber
    { at: 70,  c: [216, 196, 44] },  // yellow-green
    { at: 100, c: [46, 176, 92]  }   // green
  ];

  function colourFor(v) {
    let lo = stops[0], hi = stops[stops.length - 1];
    for (let i = 0; i < stops.length - 1; i++) {
      if (v >= stops[i].at && v <= stops[i + 1].at) { lo = stops[i]; hi = stops[i + 1]; break; }
    }
    const t = hi.at === lo.at ? 0 : (v - lo.at) / (hi.at - lo.at);
    const c = lo.c.map((ch, i) => Math.round(ch + (hi.c[i] - ch) * t));
    return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
  }

  function labelFor(v) {
    if (v === 0) return "Let's get started";
    if (v < 25) return "Warming up";
    if (v < 50) return "Getting there";
    if (v < 75) return "Good going";
    if (v < 100) return "So close";
    return "Superstar!";
  }

  function render() {
    scoreEl.textContent = score;
    labelEl.textContent = labelFor(score);
    fill.style.height = score + '%';
    const c = colourFor(score);
    fill.style.backgroundColor = c;
    wavePath.setAttribute('fill', c);
    app.classList.toggle('maxed', score === 100);
  }

  function bump(delta, x, y) {
    const next = Math.min(100, Math.max(0, score + delta));
    if (next === score) return;
    score = next;

    if (!interacted) { interacted = true; hint.style.opacity = '0'; }
    if (navigator.vibrate) navigator.vibrate(score === 100 ? [30, 60, 30] : 10);

    if (x !== undefined) {
      const r = document.createElement('div');
      r.className = 'ripple';
      r.style.left = x + 'px';
      r.style.top = y + 'px';
      app.appendChild(r);
      r.addEventListener('animationend', () => r.remove());
    }
    render();
  }

  app.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.btn')) return;
    bump(1, e.clientX, e.clientY);
  });

  app.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bump(1); }
    if (e.key === 'ArrowDown') bump(-1);
  });

  minusBtn.addEventListener('click', () => bump(-1));
  resetBtn.addEventListener('click', () => { score = 0; render(); });

  render();
</script>
</body>
</html>
