<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Alpha's Video Generating Universe — a cosmic starfield with a nebula and a film frame">
  <defs>
    <radialGradient id="neb" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#FF6FB5" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#2A2160" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#0B0A1A"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC966" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#FF6FB5" stop-opacity=".2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0B0A1A"/>
  <rect width="800" height="600" fill="url(#neb)"/>

  <!-- starfield -->
  <g fill="#EDEAFF">
    <circle cx="62" cy="78" r="1.6" opacity=".8"/><circle cx="148" cy="212" r="1.1" opacity=".5"/>
    <circle cx="236" cy="64" r="1.8" opacity=".9"/><circle cx="318" cy="168" r="1" opacity=".45"/>
    <circle cx="402" cy="52" r="1.4" opacity=".7"/><circle cx="486" cy="140" r="1.2" opacity=".55"/>
    <circle cx="560" cy="74" r="1.9" opacity=".85"/><circle cx="648" cy="186" r="1.1" opacity=".5"/>
    <circle cx="726" cy="96" r="1.5" opacity=".75"/><circle cx="92" cy="386" r="1.3" opacity=".6"/>
    <circle cx="196" cy="470" r="1.7" opacity=".8"/><circle cx="288" cy="392" r="1" opacity=".4"/>
    <circle cx="512" cy="452" r="1.6" opacity=".75"/><circle cx="604" cy="368" r="1.2" opacity=".55"/>
    <circle cx="700" cy="486" r="1.8" opacity=".85"/><circle cx="758" cy="352" r="1.1" opacity=".5"/>
    <circle cx="40" cy="524" r="1.4" opacity=".6"/><circle cx="378" cy="536" r="1.2" opacity=".5"/>
  </g>

  <!-- light rays from the core -->
  <g stroke="url(#ray)" stroke-linecap="round" opacity=".55">
    <line x1="400" y1="300" x2="150" y2="150" stroke-width="2"/>
    <line x1="400" y1="300" x2="660" y2="170" stroke-width="1.5"/>
    <line x1="400" y1="300" x2="190" y2="470" stroke-width="1.5"/>
    <line x1="400" y1="300" x2="650" y2="450" stroke-width="2"/>
  </g>

  <!-- film frame -->
  <rect x="258" y="196" width="284" height="208" rx="14" fill="#191636" fill-opacity=".82" stroke="#332C66" stroke-width="2"/>
  <g fill="#0B0A1A" opacity=".9">
    <rect x="258" y="196" width="284" height="22" rx="14"/>
    <rect x="258" y="382" width="284" height="22" rx="14"/>
  </g>
  <g fill="#FFC966" opacity=".8">
    <rect x="278" y="202" width="16" height="10" rx="3"/><rect x="318" y="202" width="16" height="10" rx="3"/>
    <rect x="358" y="202" width="16" height="10" rx="3"/><rect x="398" y="202" width="16" height="10" rx="3"/>
    <rect x="438" y="202" width="16" height="10" rx="3"/><rect x="478" y="202" width="16" height="10" rx="3"/>
    <rect x="278" y="388" width="16" height="10" rx="3"/><rect x="318" y="388" width="16" height="10" rx="3"/>
    <rect x="358" y="388" width="16" height="10" rx="3"/><rect x="398" y="388" width="16" height="10" rx="3"/>
    <rect x="438" y="388" width="16" height="10" rx="3"/><rect x="478" y="388" width="16" height="10" rx="3"/>
  </g>

  <!-- play glyph -->
  <circle cx="400" cy="300" r="44" fill="#FF6FB5" fill-opacity=".16" stroke="#FF6FB5" stroke-width="2"/>
  <path d="M387 280 L424 300 L387 320 Z" fill="#FFC966"/>

  <!-- duration dial readout -->
  <text x="400" y="356" text-anchor="middle" font-family="'Space Grotesk',system-ui,sans-serif" font-size="19" font-weight="700" fill="#EDEAFF" letter-spacing="3">02:00:00</text>
</svg>
